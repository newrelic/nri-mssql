name: Push/PR pipeline

on:
  push:
    branches:
      - main
      - master
      - renovate/**
  pull_request:

permissions:
  contents: read

jobs:
  push-pr:
    uses: newrelic/db-integrations-automation/.github/workflows/reusable_push_pr.yaml@v1
    with:
      integration: mssql
      run_test_build_fake_prerelease: true
    secrets: inherit
