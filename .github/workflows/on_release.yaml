name: Create release artifacts

on:
  release:
    types:
      - released
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    uses: newrelic/db-integrations-automation/.github/workflows/reusable_on_release.yaml@v1
    with:
      integration: mssql
      tag: ${{ github.event.release.tag_name }}
      upload_fips_packages: true
    secrets: inherit
